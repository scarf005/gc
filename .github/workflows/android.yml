name: android

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to sign and publish, e.g. v1.0.1
        required: false
        type: string
  pull_request:
  push:
    branches: [main]
    tags: [v*]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
      HAS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
      HAS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
      RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: build/release-tooling

      - uses: denoland/setup-deno@v2
        with: { cache: true }

      - name: Resolve release executable paths
        run: |
          echo "GIT_PATH=$(command -v git)" >> "$GITHUB_ENV"
          echo "GH_PATH=$(command -v gh)" >> "$GITHUB_ENV"

      - name: Check release tooling
        working-directory: build/release-tooling
        run: |
          deno fmt --check
          deno lint scripts/
          deno check scripts/*.ts
          deno task test

      - name: Validate release metadata
        id: release
        run: >-
          deno run --config=build/release-tooling/deno.json
          --allow-read="app/build.gradle.kts,build/release-tooling/fastlane/metadata/android,$GIT_PATH"
          --allow-write="build,$GITHUB_OUTPUT" --allow-run="$GIT_PATH"
          --allow-env=PATH,HOME,XDG_CONFIG_HOME,GIT_PATH,NODE_V8_COVERAGE,RELEASE_TAG,GITHUB_OUTPUT
          build/release-tooling/scripts/release.ts prepare

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify release APK version
        if: steps.release.outputs.tag != ''
        run: >-
          deno run --config=build/release-tooling/deno.json
          --allow-read="app/build.gradle.kts,build/release-tooling/fastlane/metadata/android,$GIT_PATH,$ANDROID_HOME/build-tools/36.0.0/aapt"
          --allow-run="$GIT_PATH,$ANDROID_HOME/build-tools/36.0.0/aapt"
          --allow-env=PATH,HOME,XDG_CONFIG_HOME,GIT_PATH,NODE_V8_COVERAGE,RELEASE_TAG,ANDROID_HOME
          build/release-tooling/scripts/release.ts verify

      - name: Check release signing secrets
        if: steps.release.outputs.tag != '' && (env.HAS_ANDROID_KEYSTORE_BASE64 != 'true' || env.HAS_ANDROID_KEYSTORE_PASSWORD != 'true' || env.HAS_ANDROID_KEY_ALIAS != 'true' || env.HAS_ANDROID_KEY_PASSWORD != 'true')
        run: |
          echo '::error::Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD secrets.'
          exit 1

      - name: Sign release APK
        if: steps.release.outputs.tag != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_APK: ${{ steps.release.outputs.apk }}
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          aligned="app/build/outputs/apk/release/gc-$RELEASE_VERSION-aligned.apk"
          signed="$RELEASE_APK"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$aligned"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --alignment-preserved true \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$signed" \
            "$aligned"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$signed"

      - name: Upload signed release APK
        if: steps.release.outputs.tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: gc-${{ steps.release.outputs.version }}
          path: ${{ steps.release.outputs.apk }}

      - name: Publish GitHub release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          deno run --config=build/release-tooling/deno.json
          --allow-read="app/build.gradle.kts,build/release-tooling/fastlane/metadata/android,$GIT_PATH,$GH_PATH,$ANDROID_HOME/build-tools/36.0.0/aapt"
          --allow-run="$GIT_PATH,$GH_PATH,$ANDROID_HOME/build-tools/36.0.0/aapt"
          --allow-env=PATH,HOME,XDG_CONFIG_HOME,GIT_PATH,GH_PATH,GH_TOKEN,NODE_V8_COVERAGE,RELEASE_TAG,ANDROID_HOME,GITHUB_REPOSITORY
          build/release-tooling/scripts/release.ts publish
